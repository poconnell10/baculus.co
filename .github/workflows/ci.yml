name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No schedule / cron here: M0 does not activate any scheduled market-data job.

permissions:
  contents: read

jobs:
  engine:
    name: Engine (lint, format, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest -q

      - name: M0 evidence smoke (fixtures)
        run: python scripts/prove_m0.py --out m0_proof.json

      - name: Secret scan
        run: python scripts/check_no_secrets.py

  migrations:
    name: Supabase migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baculus
          POSTGRES_PASSWORD: baculus
          POSTGRES_DB: baculus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baculus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: baculus
      DATABASE_URL: postgresql://baculus:baculus@localhost:5432/baculus
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== applying $f =="
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify append-only + seal guard enforcement
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/pg_smoke.sql
